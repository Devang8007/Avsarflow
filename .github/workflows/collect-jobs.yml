name: Automated Recruitment Collector (6-Hour Interval)

on:
  schedule:
    # Run every 6 hours at minute 0 (00:00, 06:00, 12:00, 18:00 UTC)
    # Note: GitHub Actions runs on UTC time and high-traffic queue delays of 5-15 mins may occur.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source_id:
        description: 'Specific Source ID to collect (Leave blank to run all enabled sources)'
        required: false
        default: ''
      update_statuses_only:
        description: 'Run only deadline and status evaluation (true/false)'
        required: false
        default: 'false'

concurrency:
  group: opportunityhub-collector
  cancel-in-progress: false

jobs:
  collect-recruitment-data:
    name: Execute Recruitment Collection & Extraction
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'collector/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Run verification unit tests
        run: |
          python -m pytest collector/tests/ -v

      - name: Update expired and closing-soon job statuses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m collector.main --update-statuses

      - name: Run automated recruitment collection
        if: ${{ github.event.inputs.update_statuses_only != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECTOR_TIMEOUT_SECONDS: 25
        run: |
          if [ -n "${{ github.event.inputs.source_id }}" ]; then
            python -m collector.main --source-id "${{ github.event.inputs.source_id }}"
          else
            python -m collector.main --run-all
          fi
